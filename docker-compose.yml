services:
  redis:
    image: redis:7-alpine
    container_name: nxlyr_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --appendfsync everysec
    env_file:
      - /mnt/secrets/.env

  # Pipecat telephony bot: Exotel media-stream WebSocket + outbound-call webhook.
  agent:
    build: ./agent
    container_name: nxlyr_agent
    restart: unless-stopped
    env_file:
      - /mnt/secrets/.env
    ports:
      # Loopback only, same as redis. /start will initiate real billable calls
      # once Task 5.1 lands, so this must not be published publicly without auth
      # in front of it — Exotel reaches /ws through a tunnel/proxy, not directly.
      - "127.0.0.1:7860:7860"
    depends_on:
      - redis

  # Placeholder — will be built out in Phase 1
  api:
    build: ./api
    container_name: nxlyr_api
    restart: unless-stopped
    env_file: /mnt/secrets/.env
    ports:
      - "8000:8000"
    depends_on:
      - redis
    profiles:
      - full

volumes:
  redis_data:
