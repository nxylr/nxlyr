name: PR report

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  check-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PR body has all 10 sections
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check-pr-report.py
