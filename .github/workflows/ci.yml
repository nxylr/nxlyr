name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            agent/requirements.txt
            agent/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r agent/requirements.txt -r agent/requirements-dev.txt

      - name: Import backend server
        working-directory: agent
        run: python -c "import server"

      - name: Run backend tests
        working-directory: agent
        # pending F26: test_pipeline.py is an obsolete local voice-pipeline smoke script.
        run: PYTHONPATH=.. python -m pytest -q --ignore=test_pipeline.py --ignore=stt_accuracy_test.py

  ruff-errors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            agent/requirements.txt
            agent/requirements-dev.txt

      - name: Install Ruff
        run: python -m pip install -r agent/requirements-dev.txt

      - name: Check blocking Ruff errors
        run: ruff check agent/ --select E9,F63,F7,F82

  ruff-full:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            agent/requirements.txt
            agent/requirements-dev.txt

      - name: Install Ruff
        run: python -m pip install -r agent/requirements-dev.txt

      - name: Report full Ruff results
        run: ruff check agent/ --statistics

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
